name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project bundle
        run: |
          rm -rf source
          mkdir source
          unzip -q SaffariNeuroCare_APK_BuildReady.zip -d source
          find source -maxdepth 2 -type f | head -50

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Build patient APK
        working-directory: source/mobile
        run: |
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../SaffariNeuroCare-Patient.apk

      - name: Build doctor APK
        working-directory: source/doctor_mobile
        run: |
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../SaffariNeuroCare-Doctor.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Android-APKs
          path: |
            SaffariNeuroCare-Patient.apk
            SaffariNeuroCare-Doctor.apk
          if-no-files-found: error
