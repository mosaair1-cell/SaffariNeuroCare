name: Build Android APKs and Patient Play Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saffari-neurocare-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAFFARI_API_BASE_URL: ${{ vars.SAFFARI_API_BASE_URL || 'https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Build patient ARM64 APK
        working-directory: mobile
        run: |
          flutter create . --platforms=android --org ir.mhsaffari
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission,
                  1,
              )
              manifest.write_text(text)
          PY
          python3 ../scripts/configure_flutter_android.py --label "همراه سلامت صفاری" --application-id "ir.mhsaffari.saffari_neurocare"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=upload-keystore.jks
          EOF
          fi
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --dart-define="SAFFARI_API_BASE_URL=${SAFFARI_API_BASE_URL:-https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs}"
          cp build/app/outputs/flutter-apk/app-release.apk ../SaffariNeuroCare-Patient-ARM64.apk

      - name: Build patient Google Play App Bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release --dart-define="SAFFARI_API_BASE_URL=${SAFFARI_API_BASE_URL:-https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs}"
          cp build/app/outputs/bundle/release/app-release.aab ../SaffariNeuroCare-Patient.aab

      - name: Upload patient Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && 'SaffariNeuroCare-Patient-Play-Store-AAB' || 'SaffariNeuroCare-Patient-AAB-TEST-ONLY' }}
          path: SaffariNeuroCare-Patient.aab
          if-no-files-found: error

      - name: Analyze patient APK size
        working-directory: mobile
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define="SAFFARI_API_BASE_URL=${SAFFARI_API_BASE_URL:-https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs}" --analyze-size > ../patient-size-report.txt
          tail -n 40 ../patient-size-report.txt || true

      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Patient-ARM64-APK
          path: SaffariNeuroCare-Patient-ARM64.apk
          if-no-files-found: error

      - name: Upload patient size report
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Patient-Size-Report
          path: patient-size-report.txt
          if-no-files-found: warn

      - name: Build doctor ARM64 APK
        working-directory: doctor_mobile
        run: |
          flutter create . --platforms=android --org ir.mhsaffari
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>'
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission,
                  1,
              )
              manifest.write_text(text)
          PY
          python3 ../scripts/configure_flutter_android.py --label "پنل پزشک صفاری" --application-id "ir.mhsaffari.saffari_neurocare_doctor"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
            storePassword=$ANDROID_KEYSTORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=upload-keystore.jks
          EOF
          fi
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --dart-define="SAFFARI_API_BASE_URL=${SAFFARI_API_BASE_URL:-https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs}"
          cp build/app/outputs/flutter-apk/app-release.apk ../SaffariNeuroCare-Doctor-ARM64.apk

      - name: Analyze doctor APK size
        working-directory: doctor_mobile
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define="SAFFARI_API_BASE_URL=${SAFFARI_API_BASE_URL:-https://hiiwexmjrwjaehsvxnvz.supabase.co/functions/v1/neurocare-api/v1}" --dart-define="SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_86mQsVOsDK92vf9DAGXPFg_-d2OQlWs}" --analyze-size > ../doctor-size-report.txt
          tail -n 40 ../doctor-size-report.txt || true

      - name: Upload doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Doctor-ARM64-APK
          path: SaffariNeuroCare-Doctor-ARM64.apk
          if-no-files-found: error

      - name: Upload doctor size report
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Doctor-Size-Report
          path: doctor-size-report.txt
          if-no-files-found: warn
