name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable

      - name: Build patient APK
        working-directory: mobile
        run: |
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../SaffariNeuroCare-Patient.apk

      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Patient-APK
          path: SaffariNeuroCare-Patient.apk
          if-no-files-found: error

      - name: Build doctor APK
        working-directory: doctor_mobile
        run: |
          flutter create . --platforms=android
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../SaffariNeuroCare-Doctor.apk

      - name: Upload doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffariNeuroCare-Doctor-APK
          path: SaffariNeuroCare-Doctor.apk
          if-no-files-found: error
